<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%23e6af2e'/%3E%3C/svg%3E">
  <!-- Main HTML document structure and styling for Harbor Lights -->
  <title>Harbor Lights — Spot the Difference</title>
  <!-- Responsive viewport and hud styling rules -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f1026;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .viewport {
      width: 1280px;
      height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      box-sizing: border-box;
      position: relative;
    }
    header {
      width: 1280px;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-sizing: border-box;
      background: rgba(20, 22, 50, 0.9);
      border: 2px solid #e6af2e;
      border-bottom: none;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #e6af2e;
      letter-spacing: 0.5px;
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    #counter {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffd700;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(230, 175, 46, 0.4);
    }
    #pips {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #timer {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(230, 175, 46, 0.4);
    }
    #game-canvas {
      display: block;
      width: 1280px;
      height: 480px;
      border: 2px solid #e6af2e;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      background: #000;
    }
    #win-overlay {
      position: absolute;
      top: 80px;
      left: 0;
      width: 1280px;
      height: 480px;
      display: none;
      background: rgba(10, 12, 30, 0.85);
      z-index: 10;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <header>
      <div class="title">Harbor Lights — Spot the Difference</div>
      <div class="hud-right">
        <div id="counter">Found 0 / 7 (7 remaining)</div>
        <div id="pips"></div>
        <div id="timer">Time: 00:00</div>
      </div>
    </header>
    <canvas id="game-canvas" width="1280" height="480"></canvas>
    <div id="win-overlay"></div>
  </div>
  <!-- Initialize application script entry points -->
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/shots.js"></script>
</body>
</html>
